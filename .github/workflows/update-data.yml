name: Atualizar dados do OpenStreetMap

on:
  schedule:
    - cron: "17 9 * * 1"   # toda segunda-feira, 06:17 em São Luís
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_data.py, .github/workflows/update-data.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_data.py
      - name: Salvar dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Atualiza dados do OpenStreetMap ($(date +%F))"
          git push
